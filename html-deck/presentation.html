.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

ath class="iso-shade" data-shade="1" d="M420.4 502.5L418.5 503L418.5 494.2L420.4 493.7Z"/><path class="iso-shade" data-shade="2" d="M418.5 503L416.5 502.9L416.5 494.1L418.5 494.2Z"/><path class="iso-shade" data-shade="3" d="M416.5 502.9L414.7 502.4L414.7 493.6L416.5 494.1ZM414.7 502.4L406.8 498.2L406.8 489.4L414.7 493.6ZM406.8 498.2L405.8 497.4L405.8 488.6L406.8 489.4Z"/><path class="iso-top" d="M441.4 482.3L442.3 483.2L442.2 484.2L441.1 485L420.4 493.7L418.5 494.2L416.5 494.1L414.7 493.6L406.8 489.4L405.8 488.6L405.9 487.6L407 486.8L427.8 478L429.6 477.6L431.7 477.6L433.4 478.2Z"/><path class="iso-line iso-crease" data-tone="mid" d="M442.3 483.2L442.2 484.2L441.1 485L420.4 493.7L418.5 494.2L416.5 494.1L414.7 493.6L406.8 489.4L405.8 488.6"/><path class="iso-line iso-bevel" data-tone="mid" d="M442.3 483.2L441.1 484L440.2 484.6L419.7 493.3L418.3 493.6L416.8 493.6L415.5 493.2L407.7 489.1L405.8 488.6"/><path class="iso-line iso-edge" data-tone="mid" d="M405.8 488.6L405.9 487.6L407 486.8L427.8 478L429.6 477.6L431.7 477.6L433.4 478.2L441.4 482.3L442.3 483.2M442.3 492L442.2 493L441.1 493.8L420.4 502.5L418.5 503L416.5 502.9L414.7 502.4L406.8 498.2L405.8 497.4M442.3 483.2L442.3 492M405.8 488.6L405.8 497.4"/></g></svg>';var ks=["Cash, UPI & purchase recall","Why spending recall matters","What the literature leaves open","Two competing predictions","Randomize intern teams","One college. Two payment modes.","Seven days of spending. Tuesday recall.","Remembering a purchase","The supporting measures","Sample size & analysis","The limits of the design","What either outcome would mean"],m9=["Introduction","Motivation","Literature & gap","Question & hypotheses","Experimental design","Conditions","Procedure","Primary outcome","Secondary outcomes","Analysis plan","Limitations & ethics","Implications"],l0=[20,40,60,60,60,55,65,60,40,50,45,45],L9=["We ask whether cash versus UPI changes delayed recall of everyday purchases among summer interns at one host college. This is a proposed pair-matched, cluster-randomized field experiment. The team, not the individual, is assigned to a payment mode. The experiment is scoped to one host college.","Interns are newcomers to the campus and its outlets, so long-established price knowledge is less likely to drive total reconstruction. Cash handling may make payment salient; UPI histories and notifications may rehearse purchases. These are competing predictions. By internship week 3, orientation novelty should be lower while participants are still relatively new to outlet prices.","Soman links payment rehearsal and immediacy to recall and later spending. Gafeeva and colleagues find lower accuracy for recent card payments than cash; this does not establish an effect for UPI. Srivastava and Raghubir examine decomposition of expense estimates. Our narrow gap is delayed UPI purchase recall checked against independent outlet records. Do not claim that no related experiment exists anywhere.","H1 is two-sided: purchase recall rates differ between cash and UPI. H0 is no difference. Cash salience predicts a cash advantage; UPI records and notifications predict a UPI advantage. H2 concerns absolute total-estimation error. H3 separately predicts more negative signed estimation error among UPI users. Cue gain and possible mechanisms are exploratory, not additional confirmatory hypotheses.","Invite all summer interns at the host college using an independent recruiter, not their supervisor. Eligible participants are 18 or older, new to the campus, use cash and UPI, and belong to a lab or project team of at least three interns. There is no minimum habitual cash-share threshold. Match teams on mean purchase-memory score, Spendthrift\u2013Tightwad score, habitual cash share, size, work type and outlet distance. Conceal allocation until both teams in each pair are enrolled, then randomize one to each mode. Whole-team assignment reduces within-team mixing, not all cross-team contact. One college means no college block or mode-by-college interaction.","Participants use their own money. There is no \u20B9500 task payment and no separate pot. Both arms receive 25% off their personal orders at partner outlets when using their assigned mode and discount card. Cash teams can send UPI to the daily conversion desk and receive the same amount in small notes and coins. Record conversion amounts, IDs and timestamps. UPI teams use the Food Week QR. Other purchases are unrestricted; anyone can use another mode without the discount. Histories and notifications remain part of real UPI.","Internship weeks 1\u20132: consent, online lifestyle survey and a 20-minute purchase-memory task. End of week 2: pair teams and randomize. Sunday kickoff: discount cards, outlet list, assigned-mode instructions, and the cash-conversion desk. Week 3 Monday\u2013Sunday: personal purchases are logged by outlets, with daily reconciliation and audit purchases; group orders are flagged. Week 4 Tuesday at 6 pm: surprise recall in parallel rooms at the host college. Phones are collected. Fixed order: initial total, purchase count, free purchase list, day-by-day reconstruction, revised total. Print exact study dates and outlet names. Post-recall checking, group-payment and suspicion questions plus Food Week screen-time data follow. Debrief after all sessions finish. Individual purchase delays vary; Tuesday is two days after the final spending day, not two days after every purchase.","Recall rate is correctly listed logged purchases divided by total logged purchases. Match outlet and item category, allowing \xB11 day. Two blind coders report agreement with Cohen\u2019s kappa. Amount within \u20B95 is secondary. The five-purchase demonstration is illustrative, not data. A zero-purchase participant has no defined primary recall rate; report non-purchase rates by assigned mode, retain defined estimation and false-recall outcomes, and prespecify selection sensitivity analyses.","H2 absolute total-estimation error is |log((recalled + 10)/(actual + 10))|. H3 signed estimation error is log((recalled + 10)/(actual + 10)); negative means underestimation. H3 predicts UPI underestimates more. Apply Holm correction across H2 and H3. False recall, count error and amount accuracy are secondary. Cue gain, tightwad score, habitual cash share, UPI app opens, checking and cash-conversion visits are exploratory. Fixed order mixes cueing with anchoring and retesting. App-use metrics depend on what each device reports. Mechanism associations are not causal identification.","Planning target: about 350 interns in about 58 teams, 29 matched pairs, at the single host college, subject to actual cohort capacity. Approximate planning assumes about six participants per team, ICC .05, alpha .05, 80% power, d=.30 and 20% variance reduction from matching/covariates. The plotted ICC scenarios are calculated from those assumptions: 322 at .03, 350 at .05, and 420 at .10. They are not observed data or validated power for the final logistic model. Pilot the ICC and simulate power; add team pairs if feasible. If the cohort is too small, report the minimum detectable effect or recruit another intake at the same college. Primary intention-to-treat purchase-level logistic mixed model includes mode, team-pair fixed effects, purchase delay and baseline memory, tightwad and cash-share covariates, with participant and team random intercepts. There is no college term or interaction. Report odds ratio and recall-rate contrast with 95% CIs. Do not adjust away post-assignment purchase counts or checking.","UPI records and the cash-conversion desk can both support reconstruction. The desk is an extra event only cash users experience; record it, do not claim the treatments differ in payment act alone. The 25% discount may change where and how much interns spend. The mode rule is artificial. Scope is one college, newcomers, small in-person purchases and a one-week spending window. Staff and participants see payment mode; coders and analysts can be blinded. Zero purchases, attrition, group orders and fixed cue order remain caveats. Use independent recruitment, explicit assurance the internship is unaffected, ethics approval, consent disclosing purchase logging and temporary withholding of the aim, coded IDs, minimal data, debriefing and data-withdrawal rights. Lee bounds require assumptions such as monotone selection.","If cash recall is better, replicate and then manipulate UPI notifications, PIN requirements or spending summaries to investigate salience and rehearsal. If UPI recall is better, compare record access versus unaided recall to locate the advantage. Extend beyond this college, to longer delays and other populations. If there is no clear difference, inspect the CI: precise near-zero differs from wide and inconclusive, but nonsignificance does not establish equivalence. Opposing mechanisms are a possible explanation to test, not proof of cancellation."],u0=[["Soman, D. (2001)","Effects of payment mechanism on spending behavior: The role of rehearsal and immediacy of payments. Journal of Consumer Research, 27(4), 460\u2013474.","https://doi.org/10.1086/319621"],["Gafeeva, R., Hoelzl, E., & Roschk, H. (2018)","What else can your payment card do? Multifunctionality of payment modes can reduce payment transparency. Marketing Letters, 29, 61\u201372.","https://doi.org/10.1007/s11002-017-9445-2"],["Srivastava, J., & Raghubir, P. (2002)","Debiasing using decomposition: The case of memory-based credit card expense estimates. Journal of Consumer Psychology, 12(3), 253\u2013264.","https://doi.org/10.1207/S15327663JCP1203_07"]];function na({children:n,tone:i="lime"}){return b("span",{className:`tag ${i}`,children:n})}function Un({children:n,sub:i}){return O("div",{className:"heading","data-reveal":!0,children:[b("h2",{children:n}),i&&b("p",{children:i})]})}function g9(){return b("div",{className:"printer iso","data-theme":"light",dangerouslySetInnerHTML:{__html:o0}})}function y9(){let[n,i]=$e([!0,!0,!0,!
